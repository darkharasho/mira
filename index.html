<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mira</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body class="text-white antialiased">
    <!-- Document-scoped gradients referenced by url(#…) on the Mira mark
         and Phosphor icons: off-white → faint mint, and a warm warning tint. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <linearGradient id="miraIconStroke" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f4f4f5" />
          <stop offset="1" stop-color="#a8f0bf" />
        </linearGradient>
        <linearGradient id="miraIconWarn" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fde7c2" />
          <stop offset="1" stop-color="#f0b35c" />
        </linearGradient>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
